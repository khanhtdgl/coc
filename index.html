<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tiến Trình Nâng Cấp - CoC</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <link rel="apple-touch-icon" href="icon.png">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1c1c1e; color: #fff; padding: 15px; }
        .container { max-width: 800px; margin: 0 auto; padding-bottom: 40px; }
        
        header { text-align: center; margin-bottom: 20px; background: #2c2c2e; padding: 20px; border-radius: 12px; position: relative; }
        header h1 { font-size: 1.5rem; margin-bottom: 5px; color: #fff; }
        
        .btn-toggle-edit {
            position: absolute; top: 15px; right: 15px; background: #3a3a3c; color: #f1c40f;
            border: none; padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; font-weight: bold;
        }

        h2 { margin-bottom: 15px; color: #3498db; border-bottom: 1px solid #3a3a3c; padding-bottom: 8px; font-size: 1.1rem; display: flex; align-items: center; gap: 8px;}
        .card { background: #2c2c2e; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        
        .card-hot { border: 1px solid #e67e22; background: rgba(230, 126, 34, 0.05); }
        .card-hot h2 { color: #e67e22; border-bottom-color: rgba(230, 126, 34, 0.3); }
        
        /* Giao diện bảng Thợ xây học việc giống hệt trong game */
        .apprentice-panel { background: #3a3a3c; border: 1px solid #e67e22; border-radius: 10px; padding: 12px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .apprentice-title { font-weight: bold; color: #f39c12; font-size: 0.95rem; display: flex; align-items: center; gap: 6px; }
        .apprentice-desc { font-size: 0.8rem; color: #aaa; }

        textarea { width: 100%; padding: 12px; border: 1px solid #3a3a3c; background: #1c1c1e; color: #fff; border-radius: 8px; margin-bottom: 15px; font-family: monospace; font-size: 14px; resize: vertical; outline: none; }
        textarea:focus { border-color: #3498db; }
        
        .button-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
        button { padding: 12px 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 5px; width: 100%; }
        
        .btn-info { background-color: #27ae60; color: white; flex: 1; }
        .btn-primary { background-color: #2980b9; color: white; flex: 1; }
        .btn-secondary { background-color: #e74c3c; color: white; flex: 1; }

        .item-list { list-style: none; }
        .item-list li { background: #1c1c1e; margin-bottom: 10px; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #3498db; flex-wrap: wrap; gap: 10px;}
        
        .item-list li.has-apprentice { border-left-color: #e67e22; background: rgba(230, 126, 34, 0.08); }

        #upcoming-list li { border-left-color: #e67e22; }
        #builders-list li { border-left-color: #f39c12; }
        #lab-list li { border-left-color: #9b59b6; }
        #pets-list li { border-left-color: #2ecc71; }

        .item-left-side { display: flex; align-items: center; gap: 10px; flex: 1; }
        
        /* Nút chọn thợ học việc nhỏ gọn */
        .btn-assign-app {
            background: #2c2c2e; color: #8e8e93; border: 1px solid #4a4a4c; border-radius: 6px;
            padding: 5px 10px; font-size: 0.75rem; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
            transition: 0.2s; white-space: nowrap;
        }
        .btn-assign-app.active { background: #e67e22; color: #fff; border-color: #f39c12; font-weight: bold; }

        .item-info { display: flex; flex-direction: column; gap: 4px; }
        .item-name { font-weight: 600; font-size: 0.95rem; color: #fff; }

        /* Dòng chữ "Thời gian tiết kiệm" màu cam y hệt game */
        .saved-time { font-size: 0.75rem; color: #e67e22; font-weight: bold; display: none; }
        .has-apprentice .saved-time { display: inline-block; }

        .timer-box { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
        .timer { color: #fff; font-size: 0.85em; background: #e74c3c; padding: 5px 10px; border-radius: 6px; font-weight: bold; text-align: center; white-space: nowrap; }
        .timer.done { background: #27ae60; }
        
        .target-date { 
            font-size: 0.75em; color: #f1c40f; background: rgba(241, 196, 15, 0.1); 
            border: 1px solid rgba(241, 196, 15, 0.3); padding: 3px 8px; border-radius: 4px; font-weight: 600; white-space: nowrap;
        }

        .empty-msg { color: #8e8e93; font-style: italic; background: transparent !important; border-left: none !important; justify-content: center !important; width: 100%; text-align: center; }
        .badge { background: #e74c3c; color: white; padding: 2px 8px; border-radius: 12px; font-size: 13px; font-weight: bold; margin-left: auto; }

        .app-footer { margin-top: 30px; margin-bottom: 20px; text-align: center; }
        .btn-refresh-app {
            background: transparent; color: #8e8e93; border: 1px dashed #8e8e93; border-radius: 10px;
            padding: 14px 20px; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
        }
        .btn-refresh-app:active { background: #3a3a3c; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Trạm Nâng Cấp CoC</h1>
            <p style="color: #8e8e93; font-size: 14px; margin-top: 5px;">Tag: <span id="player-tag" style="font-weight: bold; color: #f1c40f;">Đang tải...</span></p>
            <button id="btn-toggle-edit" class="btn-toggle-edit">⚙️ Sửa JSON</button>
        </header>

        <main>
            <section class="card input-section" id="input-section" style="display: none;">
                <textarea id="json-input" placeholder="Dán hoặc sửa mã JSON tại đây..." rows="5"></textarea>
                <div class="button-group">
                    <button id="btn-paste" class="btn-info">📋 Dán mã</button>
                    <button id="btn-process" class="btn-primary">🚀 Lưu & Chạy</button>
                    <button id="btn-clear" class="btn-secondary">🗑️ Xóa</button>
                </div>
                <p id="error-msg" style="color: #ff453a; margin-top: 10px; font-size: 14px; display: none; font-weight: bold;"></p>
            </section>

            <!-- BẢNG MÔ PHỎNG THỢ XÂY HỌC VIỆC CẤP 8 -->
            <div class="apprentice-panel">
                <div>
                    <div class="apprentice-title">👷 Thợ xây học việc cấp 8</div>
                    <div class="apprentice-desc">Giảm 8 giờ làm việc mỗi ngày cho 1 thợ được chọn</div>
                </div>
                <div style="text-align: right;">
                    <div style="font-size: 0.8rem; color: #f39c12; font-weight: bold;">Tốc độ: x8</div>
                </div>
            </div>

            <section class="card card-hot">
                <h2>🔥 Xong trong 24h tới <span id="upcoming-count" class="badge" style="background:#e67e22;">0</span></h2>
                <ul id="upcoming-list" class="item-list"></ul>
            </section>

            <section class="card">
                <h2>👷 Thợ Xây <span id="builder-count" class="badge">0</span></h2>
                <ul id="builders-list" class="item-list"></ul>
            </section>

            <section class="card">
                <h2>🧪 Phòng Thí Nghiệm <span id="lab-count" class="badge" style="background:#9b59b6;">0</span></h2>
                <ul id="lab-list" class="item-list"></ul>
            </section>
            
            <section class="card">
                <h2>🐾 Chuồng Linh Thú <span id="pet-count" class="badge" style="background:#2ecc71;">0</span></h2>
                <ul id="pets-list" class="item-list"></ul>
            </section>
        </main>

        <div class="app-footer">
            <button id="btn-refresh-app" class="btn-refresh-app">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.13 15.57a10 10 0 1 0 3.43-11.41L21.5 8"></path></svg>
                Tải lại dữ liệu từ GitHub
            </button>
        </div>
    </div>

    <script>
        const idDictionary = {
            102000039: "Kẻ hủy diệt", 107000001: "Máy ném bánh", 1000011: "Tháp Pháp sư",
            28000007: "Công tước Rồng", 28000000: "Man di Vương", 107000008: "Tiểu phu",
            4000082: "Lính / Phép thuật", 73000017: "Linh thú", 1000000: "Tòa thị chính"
        };

        function getName(id) { 
            if (idDictionary[id]) return idDictionary[id];
            const idStr = id.toString();
            if (idStr.startsWith("1000")) return `Công trình (${id})`;
            if (idStr.startsWith("4000") || idStr.startsWith("2600")) return `Lính/Phép (${id})`;
            if (idStr.startsWith("7300")) return `Linh thú (${id})`;
            return `Mục (${id})`; 
        }

        function formatTimeRealtime(seconds) {
            if (seconds <= 0) return "Xong! 🎉";
            const days = Math.floor(seconds / (3600 * 24));
            const hours = Math.floor((seconds % (3600 * 24)) / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            
            let timeParts = [];
            if (days > 0) timeParts.push(`${days}d`);
            if (hours > 0) timeParts.push(`${hours}h`);
            if (mins > 0) timeParts.push(`${mins}m`);
            timeParts.push(`${secs}s`);
            return `⏳ ${timeParts.join(' ')}`;
        }

        function formatSavedTime(originalSeconds, adjustedSeconds) {
            const diff = originalSeconds - adjustedSeconds;
            if (diff <= 0) return "";
            const days = Math.floor(diff / (3600 * 24));
            const hours = Math.floor((diff % (3600 * 24)) / 3600);
            if (days > 0) return `⏱️ Thời gian tiết kiệm: ${days}ngày ${hours}giờ`;
            return `⏱️ Thời gian tiết kiệm: ${hours}giờ`;
        }

        function formatTargetDate(endTimeInSeconds) {
            const date = new Date(endTimeInSeconds * 1000);
            const options = { weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false };
            return date.toLocaleDateString('vi-VN', options);
        }

        const ui = {
            upcoming: document.getElementById('upcoming-list'), builders: document.getElementById('builders-list'), 
            lab: document.getElementById('lab-list'), pets: document.getElementById('pets-list'),
            tag: document.getElementById('player-tag'), error: document.getElementById('error-msg'), input: document.getElementById('json-input'),
            section: document.getElementById('input-section'),
            counts: { upcoming: document.getElementById('upcoming-count'), builders: document.getElementById('builder-count'), lab: document.getElementById('lab-count'), pets: document.getElementById('pet-count') }
        };

        let activeTimers = []; 
        let countdownInterval = null;
        let assignedBuilderApprenticeId = null;

        function clearUI() {
            ui.upcoming.innerHTML = ''; ui.builders.innerHTML = ''; ui.lab.innerHTML = ''; ui.pets.innerHTML = '';
            ui.tag.textContent = 'Đang tải...'; ui.error.style.display = 'none';
            ui.counts.upcoming.textContent = "0"; ui.counts.builders.textContent = "0"; ui.counts.lab.textContent = "0"; ui.counts.pets.textContent = "0";
            activeTimers = [];
            if (countdownInterval) clearInterval(countdownInterval);
        }

        function extractTimers(obj, resultsArray) {
            if (Array.isArray(obj)) {
                obj.forEach(item => extractTimers(item, resultsArray));
            } else if (obj !== null && typeof obj === 'object') {
                if (obj.timer && obj.timer > 0 && obj.data !== undefined) resultsArray.push(obj);
                for (let key in obj) extractTimers(obj[key], resultsArray);
            }
        }

        function calculateAdjustedTime(timerSeconds) {
            const ratio = 16 / 24; // Cấp 8 giảm 8h mỗi ngày
            return Math.floor(timerSeconds * ratio);
        }

        let globalGameData = null;

        function processData(data) {
            globalGameData = data;
            renderAllSections();
        }

        function renderAllSections() {
            if (!globalGameData) return;
            const data = globalGameData;
            
            ui.upcoming.innerHTML = ''; ui.builders.innerHTML = ''; ui.lab.innerHTML = ''; ui.pets.innerHTML = '';
            activeTimers = [];
            if (countdownInterval) clearInterval(countdownInterval);

            ui.tag.textContent = data.tag || "Ẩn danh";
            ui.tag.style.color = "#27ae60";

            const jsonTimestamp = data.timestamp || Math.floor(Date.now() / 1000);

            let buildersData = [], labData = [], petsData = [];
            if (data.buildings) extractTimers(data.buildings, buildersData);
            if (data.traps) extractTimers(data.traps, buildersData);
            if (data.heroes) extractTimers(data.heroes, buildersData);
            if (data.guardians) extractTimers(data.guardians, buildersData);
            if (data.units) extractTimers(data.units, labData);
            if (data.spells) extractTimers(data.spells, labData);
            if (data.siege_machines) extractTimers(data.siege_machines, labData);
            if (data.pets) extractTimers(data.pets, petsData);

            let allBuilderItems = [...buildersData, ...petsData];
            if (allBuilderItems.length > 0) {
                if (!assignedBuilderApprenticeId || !allBuilderItems.some(i => i.data === assignedBuilderApprenticeId)) {
                    assignedBuilderApprenticeId = allBuilderItems[0].data;
                }
            }

            buildersData.forEach(item => {
                item.originalTimer = item.timer;
                let t = item.timer;
                if (item.data === assignedBuilderApprenticeId) t = calculateAdjustedTime(t);
                item.adjustedTimer = t;
            });
            petsData.forEach(item => {
                item.originalTimer = item.timer;
                let t = item.timer;
                if (item.data === assignedBuilderApprenticeId) t = calculateAdjustedTime(t);
                item.adjustedTimer = t;
            });
            
            labData.forEach(item => {
                item.originalTimer = item.timer;
                item.adjustedTimer = calculateAdjustedTime(item.timer);
            });

            buildersData.sort((a, b) => a.adjustedTimer - b.adjustedTimer);
            labData.sort((a, b) => a.adjustedTimer - b.adjustedTimer);
            petsData.sort((a, b) => a.adjustedTimer - b.adjustedTimer);

            let allData = [...buildersData, ...labData, ...petsData];
            let upcomingData = allData.filter(item => item.adjustedTimer <= 86400).sort((a, b) => a.adjustedTimer - b.adjustedTimer);

            function renderList(dataArray, targetUI, isMuted = false, allowAssign = false) {
                dataArray.forEach(item => {
                    const li = document.createElement('li');
                    const itemName = getName(item.data);
                    const endTime = jsonTimestamp + item.adjustedTimer;
                    const dateStr = formatTargetDate(endTime);
                    const isAssigned = allowAssign && (item.data === assignedBuilderApprenticeId);
                    const savedTimeStr = formatSavedTime(item.originalTimer, item.adjustedTimer);

                    if (isAssigned) li.classList.add('has-apprentice');

                    let assignBtnHTML = allowAssign ? `
                        <button class="btn-assign-app ${isAssigned ? 'active' : ''}" onclick="assignApprentice(${item.data})">
                            👷 ${isAssigned ? 'Đang học việc' : 'Gán thợ học việc'}
                        </button>
                    ` : '';

                    li.innerHTML = `
                        <div class="item-left-side">
                            <div class="item-info">
                                <span class="item-name">${itemName} ➡️ Cấp ${(item.lvl || 0) + 1}</span>
                                <span class="saved-time">${savedTimeStr}</span>
                                ${assignBtnHTML}
                            </div>
                        </div>
                        <div class="timer-box">
                            <span class="timer">Đang tính...</span>
                            <span class="target-date">📅 ${dateStr}</span>
                        </div>
                    `;
                    targetUI.appendChild(li);

                    activeTimers.push({ 
                        name: itemName, 
                        endTime: endTime, 
                        domElement: li.querySelector('.timer'), 
                        dateElement: li.querySelector('.target-date'),
                        isDone: false,
                        isMuted: isMuted 
                    });
                });
            }

            renderList(upcomingData, ui.upcoming, true, false);
            renderList(buildersData, ui.builders, false, true);
            renderList(labData, ui.lab, false, false);
            renderList(petsData, ui.pets, false, true);

            ui.counts.upcoming.textContent = upcomingData.length;
            ui.counts.builders.textContent = buildersData.length;
            ui.counts.lab.textContent = labData.length;
            ui.counts.pets.textContent = petsData.length;

            if (upcomingData.length === 0) ui.upcoming.innerHTML = "<li class='empty-msg'>Thoải mái đi, không có gì xong trong 24h tới...</li>";
            if (buildersData.length === 0) ui.builders.innerHTML = "<li class='empty-msg'>😴 Thợ xây rảnh rỗi...</li>";
            if (labData.length === 0) ui.lab.innerHTML = "<li class='empty-msg'>🧪 Tắt đèn...</li>";
            if (petsData.length === 0) ui.pets.innerHTML = "<li class='empty-msg'>🐾 Trống...</li>";

            startRealtimeCountdown();
        }

        window.assignApprentice = function(id) {
            assignedBuilderApprenticeId = id;
            localStorage.setItem('coc_assigned_apprentice', id);
            renderAllSections();
        }

        function startRealtimeCountdown() {
            countdownInterval = setInterval(() => {
                const now = Math.floor(Date.now() / 1000); 
                
                activeTimers.forEach(task => {
                    if (task.isDone) return;
                    
                    const remainingSeconds = task.endTime - now;
                    
                    if (remainingSeconds > 0) {
                        task.domElement.textContent = formatTimeRealtime(remainingSeconds);
                    } else {
                        task.isDone = true;
                        task.domElement.textContent = "Xong! 🎉";
                        task.domElement.classList.add('done');
                        if(task.dateElement) task.dateElement.style.display = 'none';
                        
                        if (!task.isMuted && "Notification" in window && Notification.permission === "granted") {
                            new Notification("Hoàn thành nâng cấp!", { body: `${task.name} đã nâng cấp xong!` });
                        }
                    }
                });
            }, 1000);
        }

        async function loadGameData() {
            const savedLocal = localStorage.getItem('saved_custom_coc_json');
            if (savedLocal) {
                try {
                    const data = JSON.parse(savedLocal);
                    ui.input.value = savedLocal;
                    processData(data);
                    return;
                } catch(e) {}
            }

            try {
                const response = await fetch('./data.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error();
                const data = await response.json();
                ui.input.value = JSON.stringify(data, null, 2);
                processData(data);
            } catch (error) {
                ui.tag.textContent = "Chưa có dữ liệu. Bấm 'Sửa JSON' để thêm!";
                ui.tag.style.color = "#ff453a";
            }
        }

        document.getElementById('btn-toggle-edit').addEventListener('click', () => {
            if (ui.section.style.display === 'none') {
                ui.section.style.display = 'block';
            } else {
                ui.section.style.display = 'none';
            }
        });

        function handleJSON(jsonText) {
            const text = jsonText.trim();
            if (!text) return;
            try {
                const data = JSON.parse(text); 
                processData(data);
                localStorage.setItem('saved_custom_coc_json', text);
                ui.section.style.display = 'none';
            } catch (error) {
                ui.error.textContent = "Lỗi mã JSON! Vui lòng kiểm tra lại.";
                ui.error.style.display = 'block';
            }
        }

        document.getElementById('btn-process').addEventListener('click', () => { handleJSON(ui.input.value); });
        
        document.getElementById('btn-paste').addEventListener('click', async () => {
            try { const text = await navigator.clipboard.readText(); ui.input.value = text; handleJSON(text); } 
            catch (err) { alert("Vui lòng dán thủ công!"); }
        });

        ui.input.addEventListener('paste', (e) => { setTimeout(() => { handleJSON(e.target.value); }, 100); });

        document.getElementById('btn-clear').addEventListener('click', () => {
            ui.input.value = ''; clearUI();
            localStorage.removeItem('saved_custom_coc_json');
            ui.tag.textContent = 'Đã xóa dữ liệu';
        });

        document.getElementById('btn-refresh-app').addEventListener('click', () => {
            localStorage.removeItem('saved_custom_coc_json');
            loadGameData();
        });

        window.addEventListener('DOMContentLoaded', () => {
            if(localStorage.getItem('coc_assigned_apprentice')) assignedBuilderApprenticeId = parseInt(localStorage.getItem('coc_assigned_apprentice'));
            loadGameData();
        });
    </script>
</body>
</html>
