<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash of Clans Progress Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background-color: #1e1e1e; border: 1px solid #333; }
        .timer { font-family: monospace; font-weight: bold; color: #ffc107; font-size: 1.1em; }
        .end-time { font-size: 0.85em; color: #a0a0a0; }
        textarea { background-color: #222 !important; color: #fff !important; border: 1px solid #444 !important; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body class="py-4">
    <div class="container">
        <h1 class="text-center mb-3 text-warning">🛡️ CoC Progress Tracker</h1>
        
        <div class="card p-3 mb-4 shadow">
            <h5 class="text-info mb-2">📋 Dán dữ liệu JSON vào đây:</h5>
            <textarea id="json-input" class="form-control mb-2" rows="4" placeholder="Dán đoạn JSON tài khoản của bạn vào đây..."></textarea>
            <button class="btn btn-warning w-100 fw-bold" onclick="loadDataFromInput()">Cập nhật tiến độ</button>
        </div>

        <p class="text-center text-muted mb-4">Player Tag: <span id="player-tag" class="text-white fw-bold">Chưa có</span></p>

        <div class="row g-4">
            <div class="col-md-4">
                <div class="card p-3 h-100 shadow">
                    <h4 class="text-info border-bottom pb-2">👷 Thợ Xây Đang Làm (0/6)</h4>
                    <ul id="builders-list" class="list-unstyled mt-3">
                        <li class="text-muted">Chưa có dữ liệu.</li>
                    </ul>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3 h-100 shadow">
                    <h4 class="text-info border-bottom pb-2">🧪 Phòng Thí Nghiệm</h4>
                    <ul id="lab-list" class="list-unstyled mt-3">
                        <li class="text-muted">Chưa có dữ liệu.</li>
                    </ul>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3 h-100 shadow">
                    <h4 class="text-info border-bottom pb-2">🐾 Chuồng Linh Thú</h4>
                    <ul id="pets-list" class="list-unstyled mt-3">
                        <li class="text-muted">Chưa có dữ liệu.</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        let cocData = null;

        // Từ điển ánh xạ ID sang tên tiếng Việt chuẩn theo hình ảnh game của bạn
        const nameMapping = {
            // Tướng (Heroes)
            28000000: "Vua Barbarian (BK)",
            28000001: "Nữ Hoàng Archer (AQ)",
            28000002: "Đại Warden (GW)",
            28000004: "Đội Trợ Chiến / Champion",
            28000006: "Minion Prince / Man di Vương",
            28000007: "Thợ săn Tường",
            28000003: "Vua Thợ Rèn (BH)",
            28000005: "Cỗ xe chiến đấu (BH)",
            
            // Công trình chính & Hộ vệ / Máy bắn đá / Tháp...
            107000001: "Kẻ hủy diệt (Monolith)",
            107000008: "Máy ném bánh (Spell Tower / Đồ chơi)",
            1000013: "Tháp Pháo / Công thành",
            1000011: "Xưởng chế tạo / Kho",
            1000048: "Công tước Rồng / Trại lính",
            1000043: "Tiêu phu / Pháo",
            
            // Lab (Units & Spells)
            4000082: "Nghiên cứu chung / Lab",
            
            // Linh thú (Pets - ID 73000000 đến 73000017...)
            73000000: "L.A.S.S.I",
            73000001: "Cú Điện (Electro Owl)",
            73000002: "Bò Tây Tạng Dũng Mãnh (Mighty Yak)",
            73000003: "Ngựa Một Sừng (Unicorn)",
            73000004: "Diggy",
            73000007: "Poison Lizard",
            73000008: "Angry Jelly",
            73000009: "Phoenix",
            73000010: "Spirit Fox",
            73000016: "Bọ Cạp Độc",
            73000017: "Quạ tham lam"
        };

        function formatTime(seconds) {
            if (!seconds || seconds <= 0) return "Hoàn thành";
            const d = Math.floor(seconds / (3600 * 24));
            const h = Math.floor((seconds % (3600 * 24)) / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            let res = '';
            if (d > 0) res += `${d}n `;
            if (h > 0 || d > 0) res += `${h}h `;
            if (m > 0 || h > 0 || d > 0) res += `${m}m `;
            res += `${s}s`;
            return res;
        }

        function getEndTimeString(seconds) {
            if (!seconds || seconds <= 0) return "";
            const endTime = new Date(Date.now() + seconds * 1000);
            return `📅 Kết thúc: ${endTime.toLocaleDateString('vi-VN')} ${endTime.toLocaleTimeString('vi-VN')}`;
        }

        function loadDataFromInput() {
            const rawText = document.getElementById('json-input').value.trim();
            if (!rawText) {
                alert('Vui lòng dán nội dung JSON vào ô trống!');
                return;
            }
            try {
                cocData = JSON.parse(rawText);
                
                const storageObj = {
                    saveTime: Math.floor(Date.now() / 1000),
                    rawJson: rawText
                };
                localStorage.setItem('coc_saved_data', JSON.stringify(storageObj));
                
                renderTrackers();
            } catch (e) {
                alert('Lỗi định dạng JSON! Hãy kiểm tra lại đoạn mã.');
                console.error(e);
            }
        }

        function extractItemsWithTimer(list, defaultName) {
            let items = [];
            if (list) {
                list.forEach(item => {
                    if (item.timer && item.timer > 0) {
                        let name = nameMapping[item.data] || `${defaultName} (ID: ${item.data})`;
                        items.push({ 
                            name: name, 
                            level: item.lvl, 
                            timer: item.timer 
                        });
                    }
                });
            }
            return items;
        }

        function renderList(elementId, items, headerTitle) {
            const ul = document.getElementById(elementId);
            ul.innerHTML = '';
            
            if (items.length === 0) {
                ul.innerHTML = '<li class="text-muted">Không có mục nào đang nâng cấp.</li>';
                return;
            }

            // Sắp xếp thời gian ngắn nhất lên trên đầu (tăng dần)
            items.sort((a, b) => a.timer - b.timer);

            // Cập nhật tiêu đề số lượng thợ xây đang bận nếu là cột thợ xây
            if (elementId === 'builders-list') {
                const headerEl = ul.previousElementSibling;
                if (headerEl) headerEl.innerText = `👷 Thợ Xây Đang Làm (${items.length}/6)`;
            }

            items.forEach(item => {
                ul.innerHTML += `<li class="mb-3 border-bottom pb-2">
                    <strong>${item.name}</strong><br>
                    ⬆️ Cấp: ${item.level}<br>
                    ⏱️ Còn lại: <span class="timer" data-time="${item.timer}">${formatTime(item.timer)}</span><br>
                    <span class="end-time">${getEndTimeString(item.timer)}</span>
                </li>`;
            });
        }

        function renderTrackers() {
            if (!cocData) return;
            document.getElementById('player-tag').innerText = cocData.tag || "Không rõ";

            // Quét tất cả các nguồn có thể chứa timer của thợ xây (Buildings, Heroes, Guardians, Buildings2)
            let builderItems = [
                ...extractItemsWithTimer(cocData.guardians, 'Hộ vệ / Công trình'),
                ...extractItemsWithTimer(cocData.heroes, 'Tướng'),
                ...extractItemsWithTimer(cocData.buildings, 'Công trình'),
                ...extractItemsWithTimer(cocData.buildings2, 'Công trình Builder Base')
            ];
            renderList('builders-list', builderItems);

            // Phòng thí nghiệm (Units, Spells, Units2)
            let labItems = [
                ...extractItemsWithTimer(cocData.units, 'Nghiên cứu Lính'),
                ...extractItemsWithTimer(cocData.spells, 'Nghiên cứu Phép'),
                ...extractItemsWithTimer(cocData.units2, 'Nghiên cứu BH')
            ];
            renderList('lab-list', labItems);

            // Linh thú (Pets)
            let petItems = extractItemsWithTimer(cocData.pets, 'Linh thú');
            renderList('pets-list', petItems);
        }

        window.onload = function() {
            const savedDataStr = localStorage.getItem('coc_saved_data');
            if (savedDataStr) {
                try {
                    const savedObj = JSON.parse(savedDataStr);
                    document.getElementById('json-input').value = savedObj.rawJson;
                    cocData = JSON.parse(savedObj.rawJson);

                    // Trừ bớt thời gian đã trôi qua từ lúc tắt/F5 trang để đồng hồ chạy chuẩn xác không bị reset
                    const elapsedSeconds = Math.floor(Date.now() / 1000) - savedObj.saveTime;
                    
                    ['guardians', 'heroes', 'buildings', 'buildings2', 'units', 'spells', 'units2', 'pets'].forEach(key => {
                        if (cocData[key]) {
                            cocData[key].forEach(item => {
                                if (item.timer && item.timer > 0) {
                                    item.timer = Math.max(0, item.timer - elapsedSeconds);
                                }
                            });
                        }
                    });

                    renderTrackers();
                } catch (e) {
                    console.error(e);
                }
            }
        };

        // Đếm lùi thời gian thực mỗi giây
        setInterval(() => {
            document.querySelectorAll('.timer').forEach(el => {
                let timeLeft = parseInt(el.getAttribute('data-time'));
                if (timeLeft > 0) {
                    timeLeft--;
                    el.setAttribute('data-time', timeLeft);
                    el.innerText = formatTime(timeLeft);
                }
            });
        }, 1000);
    </script>
</body>
</html>
