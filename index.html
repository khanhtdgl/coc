<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash of Clans Progress Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background-color: #1e1e1e; border: 1px solid #333; }
        .timer { font-family: monospace; font-weight: bold; color: #ffc107; font-size: 1.1em; }
        .end-time { font-size: 0.85em; color: #a0a0a0; }
        textarea { background-color: #222 !important; color: #fff !important; border: 1px solid #444 !important; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body class="py-4">
    <div class="container">
        <h1 class="text-center mb-3 text-warning">🛡️ CoC Progress Tracker</h1>
        
        <div class="card p-3 mb-4 shadow">
            <h5 class="text-info mb-2">📋 Dán dữ liệu JSON vào đây:</h5>
            <textarea id="json-input" class="form-control mb-2" rows="4" placeholder="Dán đoạn JSON tài khoản của bạn vào đây..."></textarea>
            <button class="btn btn-warning w-100 fw-bold" onclick="loadDataFromInput()">Cập nhật tiến độ</button>
        </div>

        <p class="text-center text-muted mb-4">Player Tag: <span id="player-tag" class="text-white fw-bold">Chưa có</span></p>

        <div class="row g-4">
            <div class="col-md-4">
                <div class="card p-3 h-100 shadow">
                    <h4 class="text-info border-bottom pb-2" id="builders-title">👷 Thợ Xây Đang Làm (0/6)</h4>
                    <ul id="builders-list" class="list-unstyled mt-3">
                        <li class="text-muted">Chưa có dữ liệu.</li>
                    </ul>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3 h-100 shadow">
                    <h4 class="text-info border-bottom pb-2">🧪 Phòng Thí Nghiệm</h4>
                    <ul id="lab-list" class="list-unstyled mt-3">
                        <li class="text-muted">Chưa có dữ liệu.</li>
                    </ul>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3 h-100 shadow">
                    <h4 class="text-info border-bottom pb-2">🐾 Chuồng Linh Thú</h4>
                    <ul id="pets-list" class="list-unstyled mt-3">
                        <li class="text-muted">Chưa có dữ liệu.</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        let cocData = null;

        const nameMapping = {
            // Tướng & Hộ vệ
            28000000: "Vua Barbarian (BK)",
            28000001: "Nữ Hoàng Archer (AQ)",
            28000002: "Đại Warden (GW)",
            28000004: "Nữ Hoàng Sĩ Quan / Champion",
            28000006: "Minion Prince / Man di Vương",
            28000007: "Thợ săn Tường",
            107000001: "Kẻ hủy diệt (Monolith)",
            107000008: "Máy ném bánh (Spell Tower)",
            
            // Công trình chính & Làng biển (Builder Base)
            1000013: "Tháp Pháo / Công thành",
            1000011: "Xưởng chế tạo / Kho",
            1000048: "Công tước Rồng / Trại lính",
            1000043: "Tiêu phu / Pháo",

            // Lab / Nghiên cứu
            4000082: "Nghiên cứu chung (Lab)",
            4000037: "Lính Làng Biển (Builder Base)",

            // Linh thú (Pets)
            73000000: "L.A.S.S.I",
            73000001: "Cú Điện",
            73000002: "Bò Tây Tạng Dũng Mãnh",
            73000003: "Ngựa Một Sừng",
            73000004: "Diggy",
            73000007: "Poison Lizard",
            73000008: "Angry Jelly",
            73000009: "Phoenix",
            73000010: "Spirit Fox",
            73000016: "Bọ Cạp Độc",
            73000017: "Quạ tham lam"
        };

        function formatTime(seconds) {
            if (!seconds || seconds <= 0) return "Hoàn thành";
            const d = Math.floor(seconds / (3600 * 24));
            const h = Math.floor((seconds % (3600 * 24)) / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            let res = '';
            if (d > 0) res += `${d}n `;
            if (h > 0 || d > 0) res += `${h}h `;
            if (m > 0 || h > 0 || d > 0) res += `${m}m `;
            res += `${s}s`;
            return res;
        }

        function getEndTimeString(seconds) {
            if (!seconds || seconds <= 0) return "";
            const endTime = new Date(Date.now() + seconds * 1000);
            return `📅 Kết thúc: ${endTime.toLocaleDateString('vi-VN')} ${endTime.toLocaleTimeString('vi-VN')}`;
        }

        function loadDataFromInput() {
            const rawText = document.getElementById('json-input').value.trim();
            if (!rawText) {
                alert('Vui lòng dán nội dung JSON vào ô trống!');
                return;
            }
            try {
                cocData = JSON.parse(rawText);
                const storageObj = {
                    saveTime: Math.floor(Date.now() / 1000),
                    rawJson: rawText
                };
                localStorage.setItem('coc_saved_data', JSON.stringify(storageObj));
                renderTrackers();
            } catch (e) {
                alert('Lỗi định dạng JSON! Hãy kiểm tra lại đoạn mã.');
                console.error(e);
            }
        }

        function renderTrackers() {
            if (!cocData) return;
            document.getElementById('player-tag').innerText = cocData.tag || "Không rõ";

            // 1. THỢ XÂY: Quét Guardians, Heroes, Buildings (có gear_up hoặc timer), và Buildings2
            let builderItems = [];

            if (cocData.guardians) {
                cocData.guardians.forEach(g => {
                    if (g.timer && g.timer > 0) {
                        builderItems.push({ name: nameMapping[g.data] || `Hộ vệ (ID: ${g.data})`, level: g.lvl, timer: g.timer });
                    }
                });
            }

            if (cocData.heroes) {
                cocData.heroes.forEach(h => {
                    if (h.timer && h.timer > 0) {
                        builderItems.push({ name: nameMapping[h.data] || `Tướng (ID: ${h.data})`, level: h.lvl, timer: g_name = h.timer });
                        // sửa gọn lại đối tượng push:
                        builderItems[builderItems.length - 1].timer = h.timer;
                    }
                });
            }

            if (cocData.buildings) {
                cocData.buildings.forEach(b => {
                    if (b.timer && b.timer > 0) {
                        builderItems.push({ name: nameMapping[b.data] || `Công trình (ID: ${b.data})`, level: b.lvl, timer: b.timer });
                    }
                });
            }

            if (cocData.buildings2) {
                cocData.buildings2.forEach(b2 => {
                    if (b2.timer && b2.timer > 0) {
                        builderItems.push({ name: nameMapping[b2.data] || `Công trình BH (ID: ${b2.data})`, level: b2.lvl, timer: b2.timer });
                    }
                });
            }

            // Sắp xếp thời gian ngắn nhất lên trên đầu
            builderItems.sort((a, b) => a.timer - b.timer);

            const buildersUl = document.getElementById('builders-list');
            buildersUl.innerHTML = '';
            document.getElementById('builders-title').innerText = `👷 Thợ Xây Đang Làm (${builderItems.length}/6)`;

            if (builderItems.length === 0) {
                buildersUl.innerHTML = '<li class="text-muted">Không có thợ nào đang bận.</li>';
            } else {
                builderItems.forEach(item => {
                    buildersUl.innerHTML += `<li class="mb-3 border-bottom pb-2">
                        <strong>${item.name}</strong><br>
                        ⬆️ Cấp: ${item.level}<br>
                        ⏱️ Còn lại: <span class="timer" data-time="${item.timer}">${formatTime(item.timer)}</span><br>
                        <span class="end-time">${getEndTimeString(item.timer)}</span>
                    </li>`;
                });
            }

            // 2. PHÒNG THÍ NGHIỆM: Quét units (có cờ helper_recurrent) hoặc units2 có timer
            let labItems = [];
            if (cocData.units) {
                cocData.units.forEach(u => {
                    if (u.timer && u.timer > 0 && u.helper_recurrent) {
                        labItems.push({ name: nameMapping[u.data] || `Nghiên cứu Lính (ID: ${u.data})`, level: u.lvl, timer: u.timer });
                    }
                });
            }
            if (cocData.units2) {
                cocData.units2.forEach(u2 => {
                    if (u2.timer && u2.timer > 0) {
                        labItems.push({ name: nameMapping[u2.data] || `Nghiên cứu Lính BH (ID: ${u2.data})`, level: u2.lvl, timer: u2.timer });
                    }
                });
            }

            labItems.sort((a, b) => a.timer - b.timer);
            const labUl = document.getElementById('lab-list');
            labUl.innerHTML = '';

            if (labItems.length === 0) {
                labUl.innerHTML = '<li class="text-muted">Phòng thí nghiệm đang trống.</li>';
            } else {
                labItems.forEach(item => {
                    labUl.innerHTML += `<li class="mb-3 border-bottom pb-2">
                        <strong>${item.name}</strong><br>
                        ⬆️ Cấp: ${item.level}<br>
                        ⏱️ Còn lại: <span class="timer" data-time="${item.timer}">${formatTime(item.timer)}</span><br>
                        <span class="end-time">${getEndTimeString(item.timer)}</span>
                    </li>`;
                });
            }

            // 3. LINH THÚ: Quét pets có timer
            let petItems = [];
            if (cocData.pets) {
                cocData.pets.forEach(p => {
                    if (p.timer && p.timer > 0) {
                        petItems.push({ name: nameMapping[p.data] || `Linh thú (ID: ${p.data})`, level: p.lvl, timer: p.timer });
                    }
                });
            }

            petItems.sort((a, b) => a.timer - b.timer);
            const petsUl = document.getElementById('pets-list');
            petsUl.innerHTML = '';

            if (petItems.length === 0) {
                petsUl.innerHTML = '<li class="text-muted">Không có linh thú nào đang nâng cấp.</li>';
            } else {
                petItems.forEach(item => {
                    petsUl.innerHTML += `<li class="mb-3 border-bottom pb-2">
                        <strong>${item.name}</strong><br>
                        ⬆️ Cấp: ${item.level}<br>
                        ⏱️ Còn lại: <span class="timer" data-time="${item.timer}">${formatTime(item.timer)}</span><br>
                        <span class="end-time">${getEndTimeString(item.timer)}</span>
                    </li>`;
                });
            }
        }

        window.onload = function() {
            const savedDataStr = localStorage.getItem('coc_saved_data');
            if (savedDataStr) {
                try {
                    const savedObj = JSON.parse(savedDataStr);
                    document.getElementById('json-input').value = savedObj.rawJson;
                    cocData = JSON.parse(savedObj.rawJson);

                    // Tự động trừ bù khoảng thời gian đã trôi qua khi F5 lại trang
                    const elapsedSeconds = Math.floor(Date.now() / 1000) - savedObj.saveTime;
                    
                    ['guardians', 'heroes', 'buildings', 'buildings2', 'units', 'units2', 'pets'].forEach(key => {
                        if (cocData[key]) {
                            cocData[key].forEach(item => {
                                if (item.timer && item.timer > 0) {
                                    item.timer = Math.max(0, item.timer - elapsedSeconds);
                                }
                            });
                        }
                    });

                    renderTrackers();
                } catch (e) {
                    console.error(e);
                }
            }
        };

        // Đồng hồ đếm lùi thời gian thực mỗi giây
        setInterval(() => {
            document.querySelectorAll('.timer').forEach(el => {
                let timeLeft = parseInt(el.getAttribute('data-time'));
                if (timeLeft > 0) {
                    timeLeft--;
                    el.setAttribute('data-time', timeLeft);
                    el.innerText = formatTime(timeLeft);
                }
            });
        }, 1000);
    </script>
</body>
</html>
