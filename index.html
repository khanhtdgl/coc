<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash of Clans Tracker - #PGCGR208R</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --coc-gold: #f59e0b;
            --coc-blue: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-src, sans-serif;
            min-height: 100vh;
        }
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s;
        }
        .card:hover {
            border-color: #475569;
        }
        .header-title {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        textarea.json-box {
            background-color: #0f172a !important;
            color: #38bdf8 !important;
            border: 1px solid var(--border-color) !important;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            border-radius: 8px;
        }
        textarea.json-box:focus {
            border-color: var(--coc-blue) !important;
            box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25);
        }
        .timer-badge {
            font-family: monospace;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--coc-gold);
            background: rgba(245, 158, 11, 0.1);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(245, 158, 11, 0.2);
            display: inline-block;
        }
        .progress-item {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 12px;
        }
        .progress-item:last-child {
            margin-bottom: 0;
        }
        .item-name {
            font-weight: 600;
            font-size: 1.05rem;
            color: #e2e8f0;
        }
        .item-level {
            background: #334155;
            color: #cbd5e1;
            font-size: 0.8rem;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
        }
        .end-time {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .btn-coc {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border: none;
            color: #000;
            font-weight: 700;
            transition: opacity 0.2s;
        }
        .btn-coc:hover {
            opacity: 0.9;
            color: #000;
        }
    </style>
</head>
<body class="py-5">
    <div class="container main-container">
        <div class="text-center mb-5">
            <h1 class="header-title display-5 mb-2"><i class="fa-solid fa-shield-halved"></i> Clash of Clans Tracker</h1>
            <p class="text-muted">Mã tài khoản: <span id="player-tag" class="text-white fw-bold">Chưa tải dữ liệu</span></p>
        </div>
        
        <!-- Khung dán JSON tối ưu -->
        <div class="card p-4 mb-4">
            <h5 class="text-info mb-3"><i class="fa-solid fa-code"></i> Dữ liệu JSON Trò Chơi</h5>
            <textarea id="json-input" class="form-control json-box mb-3" rows="3" placeholder="Dán toàn bộ mã JSON của bạn vào đây..."></textarea>
            <button class="btn btn-coc w-100 py-2 shadow-sm" onclick="loadDataFromInput()">
                <i class="fa-solid fa-rotate-right me-2"></i> Phân Tích & Cập Nhật Tiến Độ
            </button>
        </div>

        <!-- 3 Cột hiển thị chính -->
        <div class="row g-4">
            <!-- Cột Thợ Xây -->
            <div class="col-lg-4">
                <div class="card p-4 h-100">
                    <div class="d-flex justify-content-between align-items-center border-bottom border-secondary pb-3 mb-3">
                        <h4 class="text-warning m-0 fs-5"><i class="fa-solid fa-hard-hat me-2"></i> Thợ Xây</h4>
                        <span id="builder-count-badge" class="badge bg-warning text-dark fw-bold fs-6">0/6</span>
                    </div>
                    <div id="builders-list">
                        <div class="text-muted text-center py-4">Chưa có dữ liệu thợ xây.</div>
                    </div>
                </div>
            </div>

            <!-- Cột Phòng Thí Nghiệm -->
            <div class="col-lg-4">
                <div class="card p-4 h-100">
                    <div class="d-flex justify-content-between align-items-center border-bottom border-secondary pb-3 mb-3">
                        <h4 class="text-info m-0 fs-5"><i class="fa-solid fa-flask-vial me-2"></i> Phòng Thí Nghiệm</h4>
                        <span class="badge bg-info text-dark fw-bold fs-6">Lab</span>
                    </div>
                    <div id="lab-list">
                        <div class="text-muted text-center py-4">Phòng thí nghiệm đang trống.</div>
                    </div>
                </div>
            </div>

            <!-- Cột Linh Thú -->
            <div class="col-lg-4">
                <div class="card p-4 h-100">
                    <div class="d-flex justify-content-between align-items-center border-bottom border-secondary pb-3 mb-3">
                        <h4 class="text-success m-0 fs-5"><i class="fa-solid fa-paw me-2"></i> Chuồng Linh Thú</h4>
                        <span class="badge bg-success text-white fw-bold fs-6">Pets</span>
                    </div>
                    <div id="pets-list">
                        <div class="text-muted text-center py-4">Không có linh thú nâng cấp.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let cocData = null;

        // Từ điển tên chuẩn xác trực quan dựa theo ID thực tế trong dữ liệu game của bạn
        const nameMapping = {
            // Tướng & Hộ vệ chính
            28000000: "Vua Barbarian (BK)",
            28000001: "Nữ Hoàng Archer (AQ)",
            28000002: "Đại Warden (GW)",
            28000004: "Nữ Hoàng Sĩ Quan / Champion",
            28000006: "Minion Prince / Man di Vương",
            28000007: "Thợ săn Tường",
            107000001: "Kẻ hủy diệt (Monolith)",
            107000008: "Máy ném bánh (Spell Tower)",
            
            // Công trình
            1000013: "Tháp Pháo / Công thành",
            1000011: "Xưởng chế tạo / Kho",
            1000048: "Công tước Rồng / Trại lính",
            1000043: "Tiêu phu / Pháo",

            // Linh thú (Pets)
            73000000: "L.A.S.S.I",
            73000001: "Cú Điện",
            73000002: "Bò Tây Tạng Dũng Mãnh",
            73000003: "Ngựa Một Sừng",
            73000004: "Diggy",
            73000007: "Poison Lizard",
            73000008: "Angry Jelly",
            73000009: "Phoenix",
            73000010: "Spirit Fox",
            73000016: "Bọ Cạp Độc",
            73000017: "Quạ tham lam"
        };

        function formatTime(seconds) {
            if (!seconds || seconds <= 0) return "Đã hoàn thành";
            const d = Math.floor(seconds / (3600 * 24));
            const h = Math.floor((seconds % (3600 * 24)) / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            let res = '';
            if (d > 0) res += `${d}n `;
            if (h > 0 || d > 0) res += `${h}h `;
            if (m > 0 || h > 0 || d > 0) res += `${m}m `;
            res += `${s}s`;
            return res;
        }

        function getEndTimeString(seconds) {
            if (!seconds || seconds <= 0) return "";
            const endTime = new Date(Date.now() + seconds * 1000);
            return `📅 Kết thúc: ${endTime.toLocaleDateString('vi-VN')} lúc ${endTime.toLocaleTimeString('vi-VN')}`;
        }

        function loadDataFromInput() {
            const rawText = document.getElementById('json-input').value.trim();
            if (!rawText) {
                alert('Vui lòng dán mã JSON hợp lệ vào ô trống!');
                return;
            }
            try {
                cocData = JSON.parse(rawText);
                const storageObj = {
                    saveTime: Math.floor(Date.now() / 1000),
                    rawJson: rawText
                };
                localStorage.setItem('coc_saved_data', JSON.stringify(storageObj));
                renderTrackers();
            } catch (e) {
                alert('Lỗi cấu trúc JSON! Vui lòng kiểm tra lại đoạn mã bạn đã dán.');
                console.error(e);
            }
        }

        function renderTrackers() {
            if (!cocData) return;
            document.getElementById('player-tag').innerText = cocData.tag || "#Unknown";

            // 1. THỢ XÂY: Quét Guardians, Heroes, Buildings có timer thực tế
            let builderItems = [];

            if (cocData.guardians) {
                cocData.guardians.forEach(g => {
                    if (g.timer && g.timer > 0) {
                        builderItems.push({ name: nameMapping[g.data] || `Hộ vệ đặc biệt (ID: ${g.data})`, level: g.lvl, timer: g.timer });
                    }
                });
            }

            if (cocData.heroes) {
                cocData.heroes.forEach(h => {
                    if (h.timer && h.timer > 0) {
                        builderItems.push({ name: nameMapping[h.data] || `Tướng (ID: ${h.data})`, level: h.lvl, timer: h.timer });
                    }
                });
            }

            if (cocData.buildings) {
                cocData.buildings.forEach(b => {
                    if (b.timer && b.timer > 0) {
                        builderItems.push({ name: nameMapping[b.data] || `Công trình (ID: ${b.data})`, level: b.lvl, timer: b.timer });
                    }
                });
            }

            // Quét module bên trong buildings2 / buildings có chứa timer phụ nếu có
            if (cocData.buildings) {
                cocData.buildings.forEach(b => {
                    if (b.types) {
                        b.types.forEach(t => {
                            if (t.modules) {
                                t.modules.forEach(m => {
                                    if (m.timer && m.timer > 0) {
                                        builderItems.push({ name: nameMapping[m.data] || `Tháp Phòng Thủ / Module (ID: ${m.data})`, level: m.lvl, timer: m.timer });
                                    }
                                });
                            }
                        });
                    }
                });
            }

            if (cocData.buildings2) {
                cocData.buildings2.forEach(b2 => {
                    if (b2.timer && b2.timer > 0) {
                        builderItems.push({ name: nameMapping[b2.data] || `Công trình Làng Biển (ID: ${b2.data})`, level: b2.lvl, timer: b2.timer });
                    }
                });
            }

            // Sắp xếp thời gian ngắn nhất lên trên đầu
            builderItems.sort((a, b) => a.timer - b.timer);

            const buildersContainer = document.getElementById('builders-list');
            buildersContainer.innerHTML = '';
            document.getElementById('builder-count-badge').innerText = `${builderItems.length}/6 Thợ`;

            if (builderItems.length === 0) {
                buildersContainer.innerHTML = '<div class="text-muted text-center py-4">Tất cả thợ xây đang rảnh rỗi!</div>';
            } else {
                builderItems.forEach(item => {
                    buildersContainer.innerHTML += `
                        <div class="progress-item">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <span class="item-name">${item.name}</span>
                                <span class="item-level">Cấp ${item.level}</span>
                            </div>
                            <div class="timer mb-1" data-time="${item.timer}">${formatTime(item.timer)}</div>
                            <div class="end-time"><i class="fa-regular fa-clock me-1"></i>${getEndTimeString(item.timer)}</div>
                        </div>`;
                });
            }

            // 2. PHÒNG THÍ NGHIỆM: Quét units hoặc units2 có timer
            let labItems = [];
            if (cocData.units) {
                cocData.units.forEach(u => {
                    if (u.timer && u.timer > 0) {
                        labItems.push({ name: nameMapping[u.data] || `Nghiên cứu Lính (ID: ${u.data})`, level: u.lvl, timer: u.timer });
                    }
                });
            }
            if (cocData.units2) {
                cocData.units2.forEach(u2 => {
                    if (u2.timer && u2.timer > 0) {
                        labItems.push({ name: nameMapping[u2.data] || `Nghiên cứu BH (ID: ${u2.data})`, level: u2.lvl, timer: u2.timer });
                    }
                });
            }

            labItems.sort((a, b) => a.timer - b.timer);
            const labContainer = document.getElementById('lab-list');
            labContainer.innerHTML = '';

            if (labItems.length === 0) {
                labContainer.innerHTML = '<div class="text-muted text-center py-4">Phòng thí nghiệm đang trống.</div>';
            } else {
                labItems.forEach(item => {
                    labContainer.innerHTML += `
                        <div class="progress-item">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <span class="item-name">${item.name}</span>
                                <span class="item-level">Cấp ${item.level}</span>
                            </div>
                            <div class="timer mb-1" data-time="${item.timer}">${formatTime(item.timer)}</div>
                            <div class="end-time"><i class="fa-regular fa-clock me-1"></i>${getEndTimeString(item.timer)}</div>
                        </div>`;
                });
            }

            // 3. LINH THÚ: Quét pets có timer
            let petItems = [];
            if (cocData.pets) {
                cocData.pets.forEach(p => {
                    if (p.timer && p.timer > 0) {
                        petItems.push({ name: nameMapping[p.data] || `Linh thú (ID: ${p.data})`, level: p.lvl, timer: p.timer });
                    }
                });
            }

            petItems.sort((a, b) => a.timer - b.timer);
            const petsContainer = document.getElementById('pets-list');
            petsContainer.innerHTML = '';

            if (petItems.length === 0) {
                petsContainer.innerHTML = '<div class="text-muted text-center py-4">Không có linh thú nâng cấp.</div>';
            } else {
                petItems.forEach(item => {
                    petsContainer.innerHTML += `
                        <div class="progress-item">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <span class="item-name">${item.name}</span>
                                <span class="item-level">Cấp ${item.level}</span>
                            </div>
                            <div class="timer mb-1" data-time="${item.timer}">${formatTime(item.timer)}</div>
                            <div class="end-time"><i class="fa-regular fa-clock me-1"></i>${getEndTimeString(item.timer)}</div>
                        </div>`;
                });
            }
        }

        window.onload = function() {
            const savedDataStr = localStorage.getItem('coc_saved_data');
            if (savedDataStr) {
                try {
                    const savedObj = JSON.parse(savedDataStr);
                    document.getElementById('json-input').value = savedObj.rawJson;
                    cocData = JSON.parse(savedObj.rawJson);

                    // Khớp và tự động trừ lùi đúng số giây đã trôi qua kể từ lần lưu trước
                    const elapsedSeconds = Math.floor(Date.now() / 1000) - savedObj.saveTime;
                    
                    ['guardians', 'heroes', 'buildings', 'buildings2', 'units', 'units2', 'pets'].forEach(key => {
                        if (cocData[key]) {
                            cocData[key].forEach(item => {
                                if (item.timer && item.timer > 0) {
                                    item.timer = Math.max(0, item.timer - elapsedSeconds);
                                }
                                if (item.types) {
                                    item.types.forEach(t => {
                                        if (t.modules) {
                                            t.modules.forEach(m => {
                                                if (m.timer && m.timer > 0) {
                                                    m.timer = Math.max(0, m.timer - elapsedSeconds);
                                                }
                                            });
                                        }
                                    });
                                }
                            });
                        }
                    });

                    renderTrackers();
                } catch (e) {
                    console.error(e);
                }
            }
        };

        // Vòng lặp đếm ngược thời gian thực mỗi giây cho tất cả các bộ đếm
        setInterval(() => {
            document.querySelectorAll('.timer').forEach(el => {
                let timeLeft = parseInt(el.getAttribute('data-time'));
                if (timeLeft > 0) {
                    timeLeft--;
                    el.setAttribute('data-time', timeLeft);
                    el.innerText = formatTime(timeLeft);
                }
            });
        }, 1000);
    </script>
</body>
</html>
