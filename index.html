<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tiến Trình Nâng Cấp - CoC</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <link rel="apple-touch-icon" href="icon.png">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1c1c1e; color: #fff; padding: 15px; }
        .container { max-width: 800px; margin: 0 auto; padding-bottom: 40px; }
        
        header { text-align: center; margin-bottom: 20px; background: #2c2c2e; padding: 20px; border-radius: 12px; }
        header h1 { font-size: 1.5rem; margin-bottom: 5px; color: #fff; }
        
        h2 { margin-bottom: 15px; color: #3498db; border-bottom: 1px solid #3a3a3c; padding-bottom: 8px; font-size: 1.1rem; display: flex; align-items: center; gap: 8px;}
        .card { background: #2c2c2e; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        
        textarea { width: 100%; padding: 12px; border: 1px solid #3a3a3c; background: #1c1c1e; color: #fff; border-radius: 8px; margin-bottom: 15px; font-family: monospace; font-size: 14px; resize: vertical; outline: none; }
        textarea:focus { border-color: #3498db; }
        
        .button-group { display: flex; gap: 8px; flex-wrap: wrap; }
        button { padding: 12px 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 5px; width: 100%; }
        
        .btn-info { background-color: #27ae60; color: white; flex: 1; }
        .btn-primary { background-color: #2980b9; color: white; flex: 1; }
        .btn-secondary { background-color: #e74c3c; color: white; flex: 1; }

        .item-list { list-style: none; }
        .item-list li { background: #1c1c1e; margin-bottom: 10px; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #3498db; flex-wrap: wrap; gap: 10px;}
        
        #builders-list li { border-left-color: #f39c12; }
        #lab-list li { border-left-color: #9b59b6; }
        #pets-list li { border-left-color: #2ecc71; }

        .timer { color: #fff; font-size: 0.9em; background: #e74c3c; padding: 6px 10px; border-radius: 6px; font-weight: bold; text-align: center; white-space: nowrap; }
        .timer.done { background: #27ae60; }
        .item-name { font-weight: 500; }
        .empty-msg { color: #8e8e93; font-style: italic; background: transparent !important; border-left: none !important; justify-content: center !important;}
        
        .badge { background: #e74c3c; color: white; padding: 2px 8px; border-radius: 12px; font-size: 13px; font-weight: bold; margin-left: auto; }

        /* NÚT LÀM MỚI APP ĐÚNG CHUẨN IOS */
        .app-footer { margin-top: 30px; margin-bottom: 20px; text-align: center; }
        .btn-refresh-app {
            background: transparent; color: #8e8e93;
            border: 1px dashed #8e8e93; border-radius: 10px;
            padding: 14px 20px; font-size: 14px; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
        }
        .btn-refresh-app:active { background: #3a3a3c; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Trạm Nâng Cấp CoC</h1>
            <p style="color: #8e8e93; font-size: 14px; margin-top: 5px;">Tag: <span id="player-tag" style="font-weight: bold; color: #f1c40f;">Chưa có dữ liệu</span></p>
        </header>

        <main>
            <section class="card input-section" id="input-section">
                <textarea id="json-input" placeholder="Dán mã JSON để cập nhật tiến trình game..." rows="3"></textarea>
                <div class="button-group">
                    <button id="btn-paste" class="btn-info">📋 Dán mã</button>
                    <button id="btn-process" class="btn-primary">🚀 Chạy</button>
                    <button id="btn-clear" class="btn-secondary">🗑️ Xóa</button>
                </div>
                <p id="error-msg" style="color: #ff453a; margin-top: 10px; font-size: 14px; display: none; font-weight: bold;"></p>
            </section>

            <section class="card">
                <h2>👷 Thợ Xây <span id="builder-count" class="badge">0</span></h2>
                <ul id="builders-list" class="item-list"></ul>
            </section>

            <section class="card">
                <h2>🧪 Phòng Thí Nghiệm <span id="lab-count" class="badge" style="background:#9b59b6;">0</span></h2>
                <ul id="lab-list" class="item-list"></ul>
            </section>
            
            <section class="card">
                <h2>🐾 Chuồng Linh Thú <span id="pet-count" class="badge" style="background:#2ecc71;">0</span></h2>
                <ul id="pets-list" class="item-list"></ul>
            </section>
        </main>

        <!-- ĐÂY LÀ NÚT CẬP NHẬT WEB APP BẠN CẦN -->
        <div class="app-footer">
            <button id="btn-refresh-app" class="btn-refresh-app">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.13 15.57a10 10 0 1 0 3.43-11.41L21.5 8"></path></svg>
                Kiểm tra cập nhật / Làm mới App
            </button>
        </div>
    </div>

    <script>
        // Cài đặt Service Worker cho tính năng Offline
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }

        const idDictionary = {
            102000039: "Kẻ hủy diệt", 107000001: "Máy ném bánh", 1000011: "Tháp Pháp sư",
            28000007: "Công tước Rồng", 28000000: "Man di Vương", 107000008: "Tiểu phu",
            4000082: "Lính / Phép thuật", 73000017: "Linh thú", 1000000: "Tòa thị chính"
        };

        function getName(id) { 
            if (idDictionary[id]) return idDictionary[id];
            const idStr = id.toString();
            if (idStr.startsWith("1000")) return `Công trình (${id})`;
            if (idStr.startsWith("4000") || idStr.startsWith("2600")) return `Lính/Phép (${id})`;
            if (idStr.startsWith("7300")) return `Linh thú (${id})`;
            return `Mục (${id})`; 
        }

        function formatTimeRealtime(seconds) {
            if (seconds <= 0) return "Xong! 🎉";
            const days = Math.floor(seconds / (3600 * 24));
            const hours = Math.floor((seconds % (3600 * 24)) / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            
            let timeParts = [];
            if (days > 0) timeParts.push(`${days}d`);
            if (hours > 0) timeParts.push(`${hours}h`);
            if (mins > 0) timeParts.push(`${mins}m`);
            timeParts.push(`${secs}s`);
            return `⏳ ${timeParts.join(' ')}`;
        }

        const ui = {
            builders: document.getElementById('builders-list'), lab: document.getElementById('lab-list'), pets: document.getElementById('pets-list'),
            tag: document.getElementById('player-tag'), error: document.getElementById('error-msg'), input: document.getElementById('json-input'),
            counts: { builders: document.getElementById('builder-count'), lab: document.getElementById('lab-count'), pets: document.getElementById('pet-count') }
        };

        let activeTimers = []; 
        let countdownInterval = null;

        function clearUI() {
            ui.builders.innerHTML = ''; ui.lab.innerHTML = ''; ui.pets.innerHTML = '';
            ui.tag.textContent = 'Đang chờ...'; ui.error.style.display = 'none';
            ui.counts.builders.textContent = "0"; ui.counts.lab.textContent = "0"; ui.counts.pets.textContent = "0";
            activeTimers = [];
            if (countdownInterval) clearInterval(countdownInterval);
        }

        function extractTimers(obj, resultsArray) {
            if (Array.isArray(obj)) {
                obj.forEach(item => extractTimers(item, resultsArray));
            } else if (obj !== null && typeof obj === 'object') {
                if (obj.timer && obj.timer > 0 && obj.data !== undefined) resultsArray.push(obj);
                for (let key in obj) extractTimers(obj[key], resultsArray);
            }
        }

        function processData(data) {
            clearUI(); 
            if (!data || typeof data !== 'object') {
                ui.error.textContent = "Lỗi JSON!"; ui.error.style.display = 'block'; return;
            }
            ui.tag.textContent = data.tag || "Ẩn danh";
            ui.tag.style.color = "#27ae60";

            // Giấu ô nhập JSON đi cho giống App, khi nào cần thì chạm vào Tag để mở ra
            document.getElementById('input-section').style.display = 'none';

            const jsonTimestamp = data.timestamp || Math.floor(Date.now() / 1000);

            let buildersData = [], labData = [], petsData = [];
            if (data.buildings) extractTimers(data.buildings, buildersData);
            if (data.traps) extractTimers(data.traps, buildersData);
            if (data.heroes) extractTimers(data.heroes, buildersData);
            if (data.guardians) extractTimers(data.guardians, buildersData);
            if (data.units) extractTimers(data.units, labData);
            if (data.spells) extractTimers(data.spells, labData);
            if (data.siege_machines) extractTimers(data.siege_machines, labData);
            if (data.pets) extractTimers(data.pets, petsData);

            function renderList(dataArray, targetUI) {
                dataArray.forEach(item => {
                    const li = document.createElement('li');
                    const itemName = getName(item.data);
                    
                    li.innerHTML = `<span class="item-name">${itemName} ➡️ Cấp ${(item.lvl || 0) + 1}</span> <span class="timer">Đang tính...</span>`;
                    targetUI.appendChild(li);

                    activeTimers.push({ name: itemName, endTime: jsonTimestamp + item.timer, domElement: li.querySelector('.timer'), isNotified: false });
                });
            }

            renderList(buildersData, ui.builders);
            renderList(labData, ui.lab);
            renderList(petsData, ui.pets);

            ui.counts.builders.textContent = ui.builders.children.length;
            ui.counts.lab.textContent = ui.lab.children.length;
            ui.counts.pets.textContent = ui.pets.children.length;

            if (ui.builders.children.length === 0) ui.builders.innerHTML = "<li class='empty-msg'>😴 Thợ xây rảnh rỗi...</li>";
            if (ui.lab.children.length === 0) ui.lab.innerHTML = "<li class='empty-msg'>🧪 Tắt đèn...</li>";
            if (ui.pets.children.length === 0) ui.pets.innerHTML = "<li class='empty-msg'>🐾 Trống...</li>";

            startRealtimeCountdown();
        }

        function startRealtimeCountdown() {
            countdownInterval = setInterval(() => {
                const now = Math.floor(Date.now() / 1000); 
                activeTimers.forEach(task => {
                    if (task.isNotified) return;
                    const remainingSeconds = task.endTime - now;
                    if (remainingSeconds > 0) {
                        task.domElement.textContent = formatTimeRealtime(remainingSeconds);
                    } else {
                        task.domElement.textContent = "Xong! 🎉";
                        task.domElement.classList.add('done');
                        task.isNotified = true;
                    }
                });
            }, 1000);
        }

        // Chạm vào phần Tag để mở lại ô dán JSON
        document.getElementById('player-tag').parentElement.addEventListener('click', () => {
            document.getElementById('input-section').style.display = 'block';
            ui.input.focus();
        });

        // ==========================================
        // TÍNH NĂNG ÉP CẬP NHẬT TRANG WEB (LÀM MỚI APP)
        // ==========================================
        document.getElementById('btn-refresh-app').addEventListener('click', async () => {
            const btn = document.getElementById('btn-refresh-app');
            btn.innerHTML = '⏳ Đang xóa dữ liệu cũ và tải bản mới...';
            
            try {
                // 1. Gỡ bỏ toàn bộ Service Worker (Kẻ thù số 1 của việc cập nhật web)
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (let registration of registrations) {
                        await registration.unregister();
                    }
                }
                
                // 2. Xóa sạch sẽ toàn bộ Cache của trình duyệt
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    await Promise.all(cacheNames.map(cache => caches.delete(cache)));
                }

                // 3. Tải lại trang với một tham số thời gian để đánh lừa trình duyệt tải file mới 100%
                setTimeout(() => {
                    window.location.href = window.location.pathname + '?t=' + new Date().getTime();
                }, 500);

            } catch (err) {
                // Nếu lỗi, sử dụng cách tải lại truyền thống
                window.location.reload(true);
            }
        });

        function handleJSON(jsonText) {
            const text = jsonText.trim();
            if (!text) return;
            try {
                const data = JSON.parse(text); 
                processData(data);
                localStorage.setItem('saved_coc_json', text);
            } catch (error) {
                ui.error.textContent = "Lỗi mã JSON!";
                ui.error.style.display = 'block';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedData = localStorage.getItem('saved_coc_json');
            if (savedData) {
                ui.input.value = savedData;
                handleJSON(savedData);
            }
        });

        document.getElementById('btn-process').addEventListener('click', () => { handleJSON(ui.input.value); });
        
        document.getElementById('btn-paste').addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText(); 
                ui.input.value = text; handleJSON(text);
            } catch (err) { alert("Vui lòng dán thủ công!"); }
        });

        ui.input.addEventListener('paste', (e) => { setTimeout(() => { handleJSON(e.target.value); }, 100); });

        document.getElementById('btn-clear').addEventListener('click', () => {
            ui.input.value = ''; clearUI();
            ui.tag.textContent = 'Chưa có dữ liệu'; ui.tag.style.color = '#f1c40f';
            localStorage.removeItem('saved_coc_json');
        });
    </script>
</body>
</html>
